function newGame(){maze=makeMaze();player={x:1,y:1};const cells=openCells().filter(p=>man(p,player)>5);cells.sort(()=>Math.random()-.5);exit=cells.pop();keys=cells.splice(0,3);const far=cells.filter(p=>man(p,player)>10),first=far[Math.floor(Math.random()*far.length)]||cells[0];ghost={x:first.x,y:first.y};const far2=cells.filter(p=>man(p,player)>10&&man(p,ghost)>5),second=far2[Math.floor(Math.random()*far2.length)]||cells.find(p=>p.x!==ghost.x||p.y!==ghost.y);ghost2={x:second.x,y:second.y};keyCount=0;chaseActive=false;steps=0;slowTurn=0;lastDir={dx:1,dy:0};ended=false;draw()}function wall(x,y){return x<0||y<0||x>=N||y>=N||maze[y][x]===1}
function draw(){ctx.clearRect(0,0,600,600);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const px=x*tile,py=y*tile;if(maze[y][x]){const wallGrad=ctx.createLinearGradient(px,py,px,py+tile);wallGrad.addColorStop(0,'#344258');wallGrad.addColorStop(.12,'#263246');wallGrad.addColorStop(1,'#151d2b');ctx.fillStyle=wallGrad;ctx.fillRect(px,py,tile,tile);ctx.strokeStyle='#3a4960';ctx.lineWidth=1;ctx.strokeRect(px+1,py+1,tile-2,tile-2);ctx.strokeStyle='#0b111b';ctx.beginPath();ctx.moveTo(px+2,py+tile*.72);ctx.lineTo(px+tile-2,py+tile*.72);ctx.stroke();ctx.fillStyle='#495a73';ctx.fillRect(px+tile*.14,py+tile*.12,tile*.25,1.2)}else{const floorGrad=ctx.createLinearGradient(px,py,px+tile,py+tile);floorGrad.addColorStop(0,(x+y)%2?'#111b29':'#142031');floorGrad.addColorStop(1,(x+y)%2?'#0c1420':'#101a28');ctx.fillStyle=floorGrad;ctx.fillRect(px,py,tile,tile);ctx.strokeStyle='#1c2a3c';ctx.lineWidth=.7;ctx.strokeRect(px+.4,py+.4,tile-.8,tile-.8);ctx.fillStyle='#27374a';ctx.globalAlpha=.32;ctx.fillRect(px+tile*.46,py+tile*.46,1.2,1.2);ctx.globalAlpha=1}}const lx=player.x*tile+tile/2,ly=player.y*tile+tile/2,fog=ctx.createRadialGradient(lx,ly,tile*.3,lx,ly,tile*8);fog.addColorStop(0,'rgba(100,140,184,.18)');fog.addColorStop(.45,'rgba(38,57,80,.09)');fog.addColorStop(1,'rgba(2,5,11,.52)');ctx.fillStyle=fog;ctx.fillRect(0,0,600,600);drawDoor(exit.x,exit.y);keys.forEach(k=>drawKey(k.x,k.y));drawPlayer(player.x,player.y);if(chaseActive){drawGhost(ghost.x,ghost.y,false);drawGhost(ghost2.x,ghost2.y,true)}updateUI()}function drawDoor(x,y){const px=x*tile,py=y*tile;ctx.save();ctx.shadowColor='#ffd166';ctx.shadowBlur=16;ctx.fillStyle='#6b4b32';ctx.fillRect(px+tile*.16,py+tile*.1,tile*.68,tile*.84);ctx.shadowBlur=0;const d=ctx.createLinearGradient(px,py,px+tile,py);d.addColorStop(0,'#9a6938');d.addColorStop(.5,'#d0a45d');d.addColorStop(1,'#795132');ctx.fillStyle=d;ctx.fillRect(px+tile*.24,py+tile*.19,tile*.52,tile*.75);ctx.fillStyle='#1c2028';ctx.fillRect(px+tile*.31,py+tile*.26,tile*.38,tile*.68);ctx.strokeStyle='#e4bb72';ctx.lineWidth=1;ctx.strokeRect(px+tile*.31,py+tile*.26,tile*.38,tile*.68);ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(px+tile*.62,py+tile*.57,Math.max(1.3,tile*.045),0,7);ctx.fill();ctx.restore()}function drawKey(x,y){const cx=x*tile+tile/2,cy=y*tile+tile/2;ctx.save();ctx.shadowColor='#ffd166';ctx.shadowBlur=16;ctx.strokeStyle='#ffe08a';ctx.lineWidth=Math.max(2,tile*.075);ctx.lineCap='round';ctx.beginPath();ctx.arc(cx-tile*.08,cy-tile*.08,tile*.17,0,Math.PI*2);ctx.moveTo(cx+tile*.04,cy+tile*.04);ctx.lineTo(cx+tile*.29,cy+tile*.29);ctx.lineTo(cx+tile*.2,cy+tile*.38);ctx.moveTo(cx+tile*.23,cy+tile*.23);ctx.lineTo(cx+tile*.15,cy+tile*.31);ctx.stroke();ctx.restore()}function drawPlayer(x,y){const cx=x*tile+tile/2,cy=y*tile+tile/2;ctx.save();ctx.shadowColor='#72d6ff';ctx.shadowBlur=15;const p=ctx.createRadialGradient(cx-tile*.1,cy-tile*.12,1,cx,cy,tile*.35);p.addColorStop(0,'#f0fdff');p.addColorStop(.28,'#9eeaff');p.addColorStop(1,'#3aa9d8');ctx.fillStyle=p;ctx.beginPath();ctx.arc(cx,cy,tile*.3,0,7);ctx.fill();ctx.restore()}function drawGhost(x,y,slow=false){const cx=x*tile+tile/2,cy=y*tile+tile/2,aura=slow?'#bd7bff':'#ff4568';ctx.save();ctx.shadowColor=aura;ctx.shadowBlur=14;ctx.fillStyle=aura;ctx.beginPath();ctx.arc(cx,cy,tile*.39,0,7);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(cx,cy,tile*.33,0,7);ctx.clip();if(faceImg.complete)ctx.drawImage(faceImg,cx-tile*.33,cy-tile*.33,tile*.66,tile*.66);ctx.restore()}function updateUI(){ $('keyStat').textContent=`🗝 열쇠: ${keyCount} / 3`;$('stepStat').textContent=`👣 이동 ${steps}`;const d=Math.min(man(player,ghost),man(player,ghost2)),status=$('status');status.textContent=keyCount===3?'🚪 세 열쇠를 모두 찾았어요!':!chaseActive?'🔎 미로에서 열쇠 3개를 찾아요':d<=2?'🚨 위험! 선생님이 바로 옆에 있어요!':d<=4?'🟠 선생님이 가까워요!':d<=7?'🟡 발소리가 들려요…':'🟢 선생님이 아직 멀어요';let color=!chaseActive?'#ffd166':d<=2?'#ff405d':d<=4?'#ff8a43':d<=7?'#ffdc63':'#62e29a';status.style.color=color;$('live').textContent=status.textContent;const notice=$('threatNotice');if(notice){notice.textContent=(chaseActive?status.textContent:'🟢 아직 추격이 시작되지 않았어요')+' · ⏸ 문제를 푸는 동안 선생님도 멈춰요';notice.style.color=color;notice.style.borderColor=color;notice.style.boxShadow=chaseActive&&d<=2?'0 0 18px #ff405d77':'none'}const stage=canvas.parentElement;stage.classList.toggle('danger',chaseActive&&d<=4);stage.classList.toggle('panic',chaseActive&&d<=2);setMusic(d)}function setMusic(d){GameAudio.intensity(chaseActive?Math.max(0,1-d/12):0);if(!audio)return;const p=chaseActive?Math.max(0,1-d/12):0;gain.gain.setTargetAtTime(.012+p*.09,audio.currentTime,.12);osc.frequency.setTargetAtTime(42+p*62,audio.currentTime,.15);if(subGain)subGain.gain.setTargetAtTime(.005+p*.025,audio.currentTime,.16);if(subOsc)subOsc.frequency.setTargetAtTime(31+p*7,audio.currentTime,.2)}
function startMusic(){GameAudio.music('maze');return;try{audio=new(window.AudioContext||window.webkitAudioContext)();osc=audio.createOscillator();gain=audio.createGain();osc.type='sawtooth';osc.frequency.value=46;gain.gain.value=.007;const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=180;osc.connect(f);f.connect(gain);gain.connect(audio.destination);osc.start();subOsc=audio.createOscillator();subGain=audio.createGain();subOsc.type='sine';subOsc.frequency.value=31;subGain.gain.value=.005;subOsc.connect(subGain);subGain.connect(audio.destination);subOsc.start()}catch(e){}}
function toast(s){let el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
function ghostMove(g){const q=[[g.x,g.y]],prev=new Map([[`${g.x},${g.y}`,null]]),target=`${player.x},${player.y}`;for(let i=0;i<q.length;i++){let[x,y]=q[i];if(`${x},${y}`===target)break;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy,k=`${nx},${ny}`;if(!wall(nx,ny)&&!prev.has(k)){prev.set(k,`${x},${y}`);q.push([nx,ny])}}}if(!prev.has(target))return;let at=target;while(prev.get(at)&&prev.get(at)!==`${g.x},${g.y}`)at=prev.get(at);const[gx,gy]=at.split(',').map(Number);g.x=gx;g.y=gy}function startChase(){if(chaseTimer)return;chaseTimer=setInterval(()=>{if(!started||ended||!chaseActive||document.querySelector('.modal'))return;ghostMove(ghost);slowTurn++;if(slowTurn%2===0)ghostMove(ghost2);if((player.x===ghost.x&&player.y===ghost.y)||(player.x===ghost2.x&&player.y===ghost2.y)){draw();finish(false,'두 선생님 중 한 명에게 잡혔어요. 다시 도전해 봐요.');return}draw()},750)}function move(dx,dy,boosting=false){if(!started||ended||moveLock&&!boosting||document.querySelector('.modal'))return;moveLock=true;setTimeout(()=>moveLock=false,95);let nx=player.x+dx,ny=player.y+dy;if(wall(nx,ny)){GameAudio.sfx('bump');return}player={x:nx,y:ny};lastDir={dx,dy};steps++;GameAudio.sfx('step');if(chaseActive&&((player.x===ghost.x&&player.y===ghost.y)||(player.x===ghost2.x&&player.y===ghost2.y))){draw();finish(false);return}const idx=keys.findIndex(k=>k.x===nx&&k.y===ny);if(idx>=0){keys.splice(idx,1);GameAudio.sfx('key');if(!chaseActive){chaseActive=true;GameAudio.sfx('scare');startChase()}draw();askQuestion();return}if(nx===exit.x&&ny===exit.y){if(keyCount===3)finish(true);else toast(`열쇠가 ${3-keyCount}개 더 필요해요!`)}draw()}
function makeQuestion(){const type=Math.floor(Math.random()*5);if(type===0){let a=2+Math.floor(Math.random()*4),b=2+Math.floor(Math.random()*4);return{q:`${a} × ${b} = ?`,a:a*b,h:'작은 수로 구구단을 떠올려 보세요.'}}if(type===1){let b=2+Math.floor(Math.random()*4),q=2+Math.floor(Math.random()*4),a=b*q;return{q:`${a} ÷ ${b} = ?`,a:q,h:'몇 곱하기 나누는 수가 되는지 생각해 보세요.'}}if(type===2){let w=2+Math.floor(Math.random()*4),h=2+Math.floor(Math.random()*4);return{q:`가로 ${w}cm, 세로 ${h}cm인 직사각형의 넓이는 몇 cm²?`,a:w*h,h:'넓이 = 가로 × 세로'}}if(type===3){let s=2+Math.floor(Math.random()*6);return{q:`한 변이 ${s}cm인 정사각형의 둘레는 몇 cm?`,a:4*s,h:'한 변을 네 번 더해 보세요.'}}let candies=2+Math.floor(Math.random()*8),more=1+Math.floor(Math.random()*8);return{q:`민수는 사탕 ${candies}개가 있어요. ${more}개를 더 받으면 모두 몇 개?`,a:candies+more,h:'두 수를 더해 보세요.'}}function askQuestion(){const data=makeQuestion(),wrap=document.createElement('div');wrap.className='modal';wrap.innerHTML=`<div class="question"><h3>🗝 열쇠 ${keyCount+1}번째 수학 관문</h3><p>맞히면 열쇠 획득! 틀리면 처음부터!</p><div class="threatNotice" id="threatNotice" role="status" aria-live="polite">🟢 선생님이 아직 멀어요</div><div class="math" id="mathText"></div><form class="answer" id="answerForm"><input id="answerInput" inputmode="numeric" aria-label="정답" placeholder="정답 입력" autocomplete="off"><button class="btn">확인</button></form><p class="help" id="hint"></p></div>`;canvas.parentElement.appendChild(wrap);updateUI();wrap.querySelector('#mathText').textContent=data.q;wrap.querySelector('#hint').textContent=data.h;wrap.querySelector('#answerForm').addEventListener('submit',e=>{e.preventDefault();if(Number(wrap.querySelector('#answerInput').value)===data.a){wrap.remove();keyCount++;GameAudio.sfx('correct');toast(`정답! 열쇠 ${keyCount}/3 획득!`);draw()}else{wrap.remove();finish(false,'문제를 틀려서 미로를 처음부터 다시 시작해요.')}});wrap.querySelector('#answerInput').focus()}
function finish(win,message){ended=true;GameLog.end(win?'clear':'fail',{stage:keyCount,steps,reason:win?undefined:message?'wrong':'caught'});GameAudio.stop();GameAudio.intensity(0);GameAudio.sfx(win?'win':'lose');document.querySelectorAll('.modal').forEach(m=>m.remove());if(chaseTimer){clearInterval(chaseTimer);chaseTimer=null}if(audio){gain.gain.setTargetAtTime(0,audio.currentTime,.2);if(subGain)subGain.gain.setTargetAtTime(0,audio.currentTime,.2);try{osc.stop(audio.currentTime+1);if(subOsc)subOsc.stop(audio.currentTime+1)}catch(e){}}const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="card"><div style="font-size:3.5rem">${win?'🎉':'👻'}</div><h2>${win?'탈출 성공!':'처음부터 다시!'}</h2><p>${win?`세 열쇠를 모아 무사히 탈출했어요!<br>총 ${steps}번 이동했습니다.`:message||'선생님에게 잡혔어요. 미로를 다시 도전해 봐요.'}</p><button class="btn" id="again">새 미로 시작</button><a class="more-games" href="index.html">🎮 다른 게임들</a></div>`;canvas.parentElement.appendChild(ov);ov.querySelector('#again').onclick=()=>location.reload()}
function dir(k){return({up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]})[k]}document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(...dir(b.dataset.dir))}));addEventListener('keydown',e=>{const m={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};if(m[e.code]){e.preventDefault();move(...dir(m[e.code]))}});$('startBtn').onclick=()=>{started=true;GameLog.start('maze','normal',{maxStage:3,stage:()=>keyCount});$('start').remove();startMusic();draw();toast('흩어진 열쇠 3개를 찾아요!')};newGame()
})();</script></body></html>
